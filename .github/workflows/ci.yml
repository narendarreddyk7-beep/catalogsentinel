name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java build, unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers starts postgres:16-alpine and ElasticMQ through the runner's Docker daemon.
      - run: mvn -B -ntp verify
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/*-reports/"

  batch:
    name: PySpark batch job
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: jobs/catalog-batch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: jobs/catalog-batch/requirements-lock.txt }
      - run: pip install -r requirements-lock.txt && pip install --no-deps -e .
      - run: pytest -q
      # Smoke and seed tooling (standard library only): unit tests for its logic, no stack needed.
      - run: python -m pytest -q ../../scripts/e2e

  dashboard:
    name: Dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/dashboard/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  infrastructure:
    name: Terraform and compose checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - run: terraform fmt -check -recursive infra/terraform
      # validate needs initialised providers but no AWS credentials and no state backend.
      - run: terraform -chdir=infra/terraform/environments/demo init -backend=false -input=false
      - run: terraform -chdir=infra/terraform/environments/demo validate
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          config_file: infra/terraform/.checkov.yaml
      - run: docker compose config --quiet

  images:
    name: Container images build
    runs-on: ubuntu-24.04
    needs: [java, batch, dashboard]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f apps/Dockerfile.spring --build-arg APP=catalog-api --build-arg PORT=8080 -t catalogsentinel/catalog-api:ci .
      - run: docker build -f apps/Dockerfile.spring --build-arg APP=ingestion-worker --build-arg PORT=8081 -t catalogsentinel/ingestion-worker:ci .
      - run: docker build -t catalogsentinel/dashboard:ci apps/dashboard
      - run: docker build -t catalogsentinel/catalog-batch:ci jobs/catalog-batch
      - name: Smoke test the compose stack
        run: |
          set -o pipefail  # the default run shell is bash -e without pipefail; tee must not hide a failure
          docker compose up -d --wait catalog-api ingestion-worker dashboard
          ./scripts/smoke.sh 2>&1 | tee smoke-output.txt
      # The OpenAPI document is generated by springdoc from the running API; keep each build's copy.
      - name: Export the OpenAPI specification
        run: curl -fsS http://localhost:8080/v3/api-docs.yaml -o openapi.yaml
      - uses: actions/upload-artifact@v4
        with: { name: openapi, path: openapi.yaml }
      - if: always()
        run: docker compose logs --no-color > compose-logs.txt || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: |
            compose-logs.txt
            smoke-output.txt
