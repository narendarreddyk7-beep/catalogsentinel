# ElasticMQ (SQS-compatible) topology for the local stack. Mirrors infra/terraform/modules/messaging:
# each work queue redrives to its dead-letter queue after 6 receives. Consumers dead-letter retryable failures
# explicitly after 5 attempts (catalogsentinel.consumers.max-attempts), with a failure reason; the redrive
# policy is the safety net for messages whose consumer crashed before it could do so.
include classpath("application.conf")

# Host used in the queue URLs ElasticMQ returns. The AWS SDK v2 sends every request to its configured endpoint
# (SQS_ENDPOINT), so the apps work both inside compose (http://elasticmq:9324) and on the host (localhost:9324).
# Retention is not configurable per queue here; Terraform sets 4 days for work queues and 14 days for DLQs.
node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

aws {
  region = us-east-1
  accountId = 000000000000
}

queues {
  catalog-listing-events-dlq {
    defaultVisibilityTimeout = 30 seconds
  }
  catalog-listing-events {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "catalog-listing-events-dlq"
      maxReceiveCount = 6
    }
  }
  catalog-change-events-dlq {
    defaultVisibilityTimeout = 30 seconds
  }
  catalog-change-events {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "catalog-change-events-dlq"
      maxReceiveCount = 6
    }
  }
}
