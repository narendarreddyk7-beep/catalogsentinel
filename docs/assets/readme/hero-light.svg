<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
<title id="t">CatalogSentinel</title>
<desc id="d">A barcode whose bars stand for products. Most bars are solid (carried by the marketplace); five are dashed amber outlines (missing products, selection gaps). A teal scanner line sweeps across them.</desc>
<style>svg{--bg:#FFFFFF;--panel:#F6F8FA;--card:#FFFFFF;--line:#D0D7DE;--track:#EAEEF2;--ink:#1F2328;--muted:#59636E;--teal:#0D9488;--indigo:#4F46E5;--amber:#C2410C;--teal-soft:#E6F4F2;--amber-soft:#FBEDE6;--indigo-soft:#EEEDFC}@keyframes scan{0%{transform:translateX(0);opacity:0}4%{opacity:1}80%{transform:translateX(340px);opacity:1}86%,100%{transform:translateX(340px);opacity:0}}.scan{animation:scan 5.0s linear 0.6s 3 both}@keyframes hit0{0%,7.5%,17.5%,100%{fill-opacity:1}12.5%{fill-opacity:0.2}}.g0{animation:hit0 5.0s linear 0.6s 3}@keyframes hit1{0%,25.6%,35.6%,100%{fill-opacity:1}30.6%{fill-opacity:0.2}}.g1{animation:hit1 5.0s linear 0.6s 3}@keyframes hit2{0%,41.3%,51.3%,100%{fill-opacity:1}46.3%{fill-opacity:0.2}}.g2{animation:hit2 5.0s linear 0.6s 3}@keyframes hit3{0%,57.9%,67.9%,100%{fill-opacity:1}62.9%{fill-opacity:0.2}}.g3{animation:hit3 5.0s linear 0.6s 3}@keyframes hit4{0%,69.4%,79.4%,100%{fill-opacity:1}74.4%{fill-opacity:0.2}}.g4{animation:hit4 5.0s linear 0.6s 3}@media (prefers-reduced-motion: reduce){.scan,.gap{animation:none}.scan{opacity:0}}</style>
