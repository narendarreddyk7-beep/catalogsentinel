<text x="48" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="var(--muted)" text-anchor="start" >Matches product listings from many sources,</text>
